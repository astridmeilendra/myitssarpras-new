name: CI/CD Pipeline MyITS Sarpras

on:
  push:
    branches:
      - main # Ubah ke 'master' jika branch utamamu bernama master

env:
  REGISTRY: myitssarprasregistry.azurecr.io # GANTI: URL ACR kamu
  IMAGE_NAME: myitssarpras-app              # Nama image Docker kamu

jobs:
  # Tahap 1: Jalankan Testing dengan Pest
  test:
    name: Run Pest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Setup Environment File
        run: |
          touch .env
          echo "APP_ENV=testing" >> .env
          echo "APP_KEY=" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
        
      - name: Install Composer Dependencies
        run: composer update -q --no-ansi --no-interaction --no-progress --prefer-dist --ignore-platform-reqs
        
      - name: Generate Application Key
        run: php artisan key:generate
        
      - name: Run Pest Tests
        run: ./vendor/bin/pest

  # Tahap 2: Build & Push ke ACR (Selesai sampai di sini!)
  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest .
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} --all-tags